{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<div class="panel">
  <h1>Create account</h1>
  <form method="post">
    <label for="u">Username</label><input type="text" id="u" name="username" autocomplete="username" required>
    <label for="p">Password (8+ characters)</label><input type="password" id="p" name="password" autocomplete="new-password" required minlength="8">
    <button type="submit">Create account</button>
  </form>
  <p class="muted"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</div>
{% endblock %}
